[project]
name = "altadata"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "tenacity>=9.0",
    "shapely>=2.0",
    "click>=8.1",
    "python-dotenv>=1.0",
]

[project.scripts]
altadata = "altadata.cli:run"

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-httpx>=0.32",
    "ruff>=0.4",
    "mypy>=1.10",
    "types-shapely>=2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/altadata"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.ruff.lint.per-file-ignores]
# Prompt file is content-as-string; line breaks would change what's sent to the LLM.
"src/altadata/processing/llm_prompts.py" = ["E501"]

[tool.mypy]
strict = true
mypy_path = "src"
packages = ["altadata"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
